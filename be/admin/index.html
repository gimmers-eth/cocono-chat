<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>cocono-chat admin</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>cocono-chat — internal admin</h1>
    <div class="panel">
      <div class="row">
        <label class="dim" for="token">Admin token</label>
        <input id="token" type="password" placeholder="ADMIN_TOKEN (blank if not set)" size="36" />
        <button id="btn-refresh">Refresh</button>
        <span id="updated" class="dim"></span>
      </div>
      <p id="status"></p>
    </div>

    <h2>Rate limits</h2>
    <div class="panel">
      <div class="row">
        <input id="clear-ip" type="text" placeholder="IP address" size="24" />
        <button id="btn-clear-ip">Clear limits for IP</button>
      </div>
      <table>
        <thead>
          <tr><th>Limit</th><th>Scope</th><th>Subject</th><th>Count / limit</th><th>Window</th><th>Resets in</th><th></th></tr>
        </thead>
        <tbody id="limits-body"></tbody>
      </table>
      <p id="limits-empty" class="dim" hidden>No active rate-limit counters.</p>
    </div>

    <h2>Users &amp; devices</h2>
    <div class="panel">
      <table>
        <thead>
          <tr><th>User</th><th>Created</th><th>Max devices</th><th>Devices</th><th></th></tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
      <p id="users-empty" class="dim" hidden>No users yet.</p>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
