openapi: 3.0.3
info:
  title: cocono-chat backend API
  version: 0.1.0
  description: |
    REST API for cocono-chat (milestones 1–2: accounts + multi-device).

    ## Encoding conventions

    - All binary material (public keys, AES keys, signatures, nonces) is encoded as
      **base64url** (RFC 4648 §5, no padding).
    - Ed25519 public keys are the **raw 32-byte** key (`crypto.subtle.exportKey('raw')`
      in the browser).
    - Signatures are computed over the UTF-8 bytes of the **canonical JSON** of the
      signed object: object keys sorted lexicographically, no whitespace
      (e.g. `canonical({u,p,a,d,t})` → `{"a":...,"d":...,"p":...,"t":...,"u":...}`).
    - Signed payloads (signup, device enrollment) include a client timestamp `t`
      (epoch seconds) that must be within `SIGNED_PAYLOAD_MAX_AGE_SEC` (default 5
      minutes); each signature is additionally de-duplicated in Redis, so captured
      payloads cannot be replayed.

    ## Authentication

    There are no passwords. Login is a challenge-response proof of possession of a
    registered device's Ed25519 private key:

    1. `POST /api/auth/challenge` → one-time nonce `n` (Redis-backed, TTL, single-use).
       A nonce is issued for ANY username/device pair — unknown pairs get a nonce that
       simply never verifies, so the endpoint does not reveal which accounts exist.
    2. Client signs the nonce string (UTF-8 bytes) with the device key.
    3. `POST /api/auth/verify` → JWT (HS256, `iss`/`aud` pinned) for use as
       `Authorization: Bearer <token>`.

    JWTs are re-checked against the live device registry on every authenticated
    request: a device removed by an admin loses access immediately, without waiting
    for token expiry.

    Errors are returned as `{ "error": <code>, "message": <human readable> }`.
    Rate-limited responses (429) additionally carry a `Retry-After` header (seconds).

    ## Device adding (milestone 2)

    An existing account can have multiple devices (default max 3). A new device
    enrolls with its own keys (`POST /api/devices/enroll`, same shape as signup),
    receives a 6-digit pairing code, and polls `GET /api/devices/enroll-status`.
    A device already registered on the account approves the code
    (`POST /api/devices/approve`, JWT). Once approved the new device logs in via
    the normal challenge-response flow. Codes expire after `DEVICE_CODE_TTL_SEC`
    (default 10 minutes).
servers:
  - url: http://127.0.0.1:3000
    description: Local development server (pnpm dev)

tags:
  - name: media
  - name: accounts
    description: Account creation
  - name: auth
    description: Passwordless challenge-response login and session info
  - name: devices
    description: Multi-device enrollment
  - name: friends
    description: One-way trust list (server is the source of truth; devices sync via E2EE system messages), approval and listing (milestone 2)

paths:
  /api/signup:
    post:
      tags: [accounts]
      operationId: signup
      summary: Create an account with the first device
      description: |
        Registers a username together with the first device's Ed25519 public key and
        AES-GCM transport key. The request must be signed with the new Ed25519 private
        key to prove ownership. Usernames are 5-64 characters of `[a-zA-Z0-9_-]`,
        normalised to lowercase at signup (case-insensitively unique), and must
        not be reserved.

        The signed payload includes a client timestamp `t` and is protected against
        replay (see info description).

        Rate limited per client IP (default 5/hour).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              u: alice
              p: k7Sb3QKx9d2mVn4rT8uYw1zAe5fGh0jLpQsXcBvN
              a: F9r2KjLm8nPqRsT1uVwXyZa3bCdEfGhIjKlMnOpQrS
              d: 01234567-89ab-cdef-0123-456789abcdef
              t: 1787600000
              s: zYxWvUtSrQpOnMlKjIhGfEdCbAzYxWvUtSrQpOnMlKjIhGfEdCbAzYxWvUtSrQpOnMlKjIhGfEdCbA
      responses:
        '201':
          description: Account created. The device is registered as the main device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: |
            Validation failure. `error` is one of:
            `invalid_username`, `reserved_username`, `invalid_device_id`,
            `invalid_public_key`, `invalid_aes_key`,
            `stale_payload` (timestamp missing or outside the freshness window).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            `error` is one of:
            `invalid_signature` (signature does not verify),
            `replay` (this exact signed payload was already used).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Username already registered (`error: username_taken`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/challenge:
    post:
      tags: [auth]
      operationId: authChallenge
      summary: Request a one-time login nonce
      description: |
        Returns a single-use nonce bound to the given username + device id. The nonce is
        random 32 bytes (base64url), stored in Redis with a TTL (default 300 seconds),
        and is consumed by the first verify attempt — successful or not.

        A nonce is issued for ANY username/device pair: unknown pairs get a nonce that
        simply never verifies, so this endpoint does not reveal which accounts or
        devices exist.

        Rate limited per client IP (default 30/15min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
            example:
              u: alice
              d: 01234567-89ab-cdef-0123-456789abcdef
      responses:
        '200':
          description: Nonce issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '400':
          description: 'Missing or malformed fields (`error: invalid_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/verify:
    post:
      tags: [auth]
      operationId: authVerify
      summary: Verify the signed nonce and receive a JWT
      description: |
        Consumes the nonce and verifies the Ed25519 signature over the nonce string
        (its UTF-8 bytes) against the device's stored public key. On success a JWT
        (HS256, default expiry 24h) is issued with payload
        `{ sub, u, d, iss, aud, iat, exp }`.

        Ordering matters: the nonce is consumed BEFORE the rate limits are counted,
        so junk requests (no valid nonce) cannot exhaust an account's budget. Valid
        attempts are limited per account AND per IP (defaults 20/15min each).

        Failed attempts consume the nonce too (a new challenge is needed to retry).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example:
              u: alice
              d: 01234567-89ab-cdef-0123-456789abcdef
              n: nOq3rT6uYw9zAc2eFg5hJk8mNpQsVx
              s: aBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZaB
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: 'Missing or malformed fields (`error: invalid_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            `error` is one of:
            `bad_nonce` (unknown, expired, already consumed, or username/device
            mismatch), `bad_signature` (signature does not verify).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/me:
    get:
      tags: [auth]
      operationId: me
      summary: Current account info
      description: Returns the authenticated user's display name and device id.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                u: alice
                d: 01234567-89ab-cdef-0123-456789abcdef
                createdAt: '2026-08-24T15:00:00.000Z'
        '401':
          description: 'Missing, malformed or expired token (`error: unauthorized`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Account no longer exists (`error: unknown_account`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me/friends:
    get:
      tags: [friends]
      operationId: listFriends
      summary: Friends list (identity-bound, one-way trust)
      description: >
        Server-side list is the source of truth; devices mirror it locally
        and stay live via E2EE system messages broadcast by the acting
        device (not by the server). Each entry carries the identity-key
        binding (p, stamped by the server at add time) resolved against the
        live directory: gone = account deleted; changed = username
        re-registered (binding stale); trusted = binding matches.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Friends entries (lowercase, sorted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      type: object
                      properties:
                        u: { type: string }
                        p: { type: [string, 'null'] }
                        gone: { type: boolean }
                        changed: { type: boolean }
                        trusted: { type: boolean }

  /api/me/relationships:
    get:
      summary: Unified relationship view (added contacts with trust stages + blocked users with the blocker's reason)
      responses:
        '200': { description: '{ added: [enriched friend entries], blocked: [{peer, addedBack, reason, at}] }' }
        '401': { description: 'Missing/invalid token' }
  /api/me/friends/{ul}/mute:
    put:
      summary: Mute a user (notifications only — messages still deliver; account-level, mirrors to every device; push gate enforced server-side)
      parameters:
        - { in: path, name: ul, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ muted: true }' }
        '400': { description: 'self_mute / bad_username' }
        '404': { description: 'unknown_account' }
    delete:
      summary: Lift a mute (re-enables notifications from that user)
      parameters:
        - { in: path, name: ul, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ muted: false }' }

  /api/me/friends/{ul}/block:
    put:
      summary: Block a user (severs the relation both ways; gates their sends at the ws send seam before storage; reason required)
      parameters:
        - in: path
          name: ul
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [r]
              properties:
                r: { type: string, enum: [nospeak, unknown, scam] }
      responses:
        '200': { description: '{ blocked: true }' }
        '400': { description: 'self_block / invalid_request (reason missing or not in the enum)' }
        '403': { description: 'rate-limited' }
        '404': { description: 'unknown_account' }
    delete:
      summary: Lift a block (nothing is restored — relations rebuild deliberately)
      parameters:
        - in: path
          name: ul
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{ blocked: false }' }

  /api/me/stage-limits:
    get:
      tags: [friends]
      operationId: stageLimits
      summary: Own verify/trust stage budgets (limits in force + usage)
      description: >
        Per-account vouching budgets (fvday/fvweek/ftday/ftweek): the limit
        actually in force (admin layering: user override > app override >
        default) and the spend from the current fixed-window counters. Only
        ever returns the caller's own numbers; used is clamped to the limit
        because blocked attempts still count (grinding protection).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The four budget windows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  verifyDaily: { $ref: '#/components/schemas/StageBudget' }
                  verifyWeekly: { $ref: '#/components/schemas/StageBudget' }
                  trustDaily: { $ref: '#/components/schemas/StageBudget' }
                  trustWeekly: { $ref: '#/components/schemas/StageBudget' }

  /api/me/friends/{username}:
    put:
      tags: [friends]
      operationId: addFriend
      summary: Bind a user's current account identity as trusted (one-way)
      description: >
        The server stores the target's LIVE identity key (clients cannot
        claim one). Re-adding an existing entry explicitly RE-BINDS it to
        the current identity — the sanctioned way to recover from `changed`.
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated friends entries (schema as in GET).
        '400': { description: 'Invalid username or self-friending.' }
        '404': { description: 'No such user.' }
        '409': { description: 'Friends list full (FRIENDS_MAX).' }
    delete:
      tags: [friends]
      operationId: removeFriend
      summary: Revoke trust in a user
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated friends entries (schema as in GET).

  /api/users/{username}/stats:
    get:
      tags: [accounts]
      operationId: userStats
      summary: Reputation counts for a profile (numbers only, never identities)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exclusive vouch-stage buckets (addedBy / verifiedBy / trustedBy) plus the CoCo score (verifiedBy + 3×trustedBy, see docs/COCO_SCORE.md).
        '404': { description: 'No such user.' }

  /api/share/hit:
    post:
      tags: [accounts]
      operationId: shareHit
      summary: Report that this account opened someone's share link
      description: |
        The "seen" half of share-link attribution (docs/SHARES.md): an account
        that ALREADY existed opened `/?chat=<o>`. Requires a session — the fact
        being stored is a relation between two accounts, and an anonymous
        endpoint here would be a free write-anywhere graph spoofer. The write
        is an upsert on the (owner, viewer) pair, so repeated clicks bump a
        counter instead of adding rows; rate limited per account (`sharehit`).

        Opening your OWN link is not an attribution event: `{recorded:false}`.
        Nothing about any conversation is recorded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [o]
              properties:
                o:
                  allOf:
                    - $ref: '#/components/schemas/Username'
                  description: The link owner (the account that shared).
            example: { o: alice }
      responses:
        '200': { description: '`{recorded: true|false, o}` — false for your own link.' }
        '400': { description: 'Malformed username.' }
        '401': { description: 'Missing or invalid token.' }
        '404': { description: 'The link owner no longer exists.' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/me/share-link:
    get:
      tags: [accounts]
      operationId: myShareLink
      summary: Your own share-link path and what it has produced (counts only)
      description: |
        `{ ul, path, created, clicked }` — the deep link to hand out, how many
        accounts were CREATED from it, and how many accounts have opened it.
        Counts only: the app never learns WHO, that view belongs to the admin
        panel (docs/SHARES.md).
      security:
        - bearerAuth: []
      responses:
        '200': { description: 'Link path + created/clicked counts.' }
        '401': { description: 'Missing or invalid token.' }

  /api/me/verify-id:
    post:
      tags: [auth]
      operationId: submitIdDoc
      summary: Upload an ID-document photo for admin review
      description: >
        image/png or image/jpeg only, ID_DOC_MAX_BYTES capped (default 5 MB).
        Rejected once the account is verified. UNLOCKS only after at least
        one VERIFIED user has TRUSTED this account (vouching gate,
        ID_UPLOAD_REQUIRES_TRUSTED_VERIFIER). Stored server-side, readable
        only by the admin API; the admin can verify with or without it and
        deletes the photo after review.
      security:
        - bearerAuth: []
      responses:
        '200': { description: Stored. }
        '400': { description: 'Bad type, bad payload, or already verified.' }
        '413': { description: 'Photo exceeds the size cap.' }

  /api/media:
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Upload a media blob (ciphertext only) — milestone 4
      description: >
        The BYTES half of a media message; the message that references the blob
        rides the WebSocket queue with a plaintext `att` descriptor. The server
        stores `iv‖ct‖tag` and cannot read it (the per-file key travels inside
        each recipient's encrypted envelope), so the abuse surface is SIZE:
        MEDIA_MAX_BYTES per blob, MEDIA_THUMB_MAX_BYTES per thumbnail,
        MEDIA_QUOTA_MB per account, plus retention/orphan sweeps. The claimed
        sha256 must match the uploaded bytes. Blobs are deleted once every
        authorised device has acked (downloaded or declined).
      security:
        - bearerAuth: []
      responses:
        '201': { description: 'Stored — returns the blob id.' }
        '400': { description: 'Bad kind, bad payload, or sha256 mismatch.' }
        '413': { description: 'Over the blob, thumb or account-quota caps.' }
        '429': { description: 'mediaup / mediaupacct budget exhausted.' }

  /api/media/{id}:
    get:
      tags: [media]
      operationId: downloadMedia
      summary: Fetch a blob's ciphertext (or just its thumbnail)
      description: >
        Allowed only for the uploader or a device listed on the blob's
        `devices` — never username-only. Answers `404 unknown_media` for
        missing, swept and not-yours alike (no enumeration). Always
        `application/octet-stream` + `nosniff`: user content is never served
        as a browser-renderable type from our origin. `?part=thumb` returns
        the encrypted poster (video previews without a full pull) and
        deliberately does NOT ack.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: part
          in: query
          required: false
          schema: { type: string, enum: [thumb] }
      responses:
        '200': { description: 'Raw ciphertext bytes (ETag = sha256).' }
        '404': { description: 'unknown_media.' }
        '429': { description: 'mediadl / mediadlacct budget exhausted.' }

  /api/media/{id}/ack:
    post:
      tags: [media]
      operationId: ackMedia
      summary: Settle a device's debt on a blob (downloaded or declined)
      description: >
        `downloaded:false` is the "delete before downloading" path (it counts
        as received). Idempotent; removes the caller's {ul,dv} from `pending`
        and, when nothing is owed and nothing is report-pinned, deletes the
        blob.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{ ok, deleted }.' }
        '400': { description: 'downloaded must be a boolean.' }
        '404': { description: 'unknown_media (not a listed device, or gone).' }

  /api/admin/users/{username}/verified:
    put:
      tags: [admin]
      operationId: adminSetVerified
      summary: Toggle identity verification for an account (admin's discretion)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 'Updated flag.' }
        '404': { description: 'No such user.' }

  /api/admin/users/{username}/id-doc:
    get:
      tags: [admin]
      operationId: adminGetIdDoc
      summary: View a user's ID photo (admin surface, loopback-bound)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 'Raw image bytes.' }
        '404': { description: 'No document on file.' }
    delete:
      tags: [admin]
      operationId: adminDeleteIdDoc
      summary: Delete a user's ID photo (verification state is kept)
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 'Deleted.' }
        '404': { description: 'No document on file.' }

  /api/devices/enroll:
    post:
      tags: [devices]
      operationId: deviceEnroll
      summary: Request to add this device to an existing account
      description: |
        Same shape and signing rules as signup, but targeting an account that already
        exists and signed by the NEW device's key. The server issues a 6-digit pairing
        code (shown on the new device) that a device already registered on the account
        must approve via `POST /api/devices/approve`. The new device polls
        `GET /api/devices/enroll-status/{enrollId}` until approved.

        Enrollment itself is unauthenticated — approval by an existing device is the
        gate. The payload follows the same freshness + replay rules as signup.
        Rate limited per client IP (default 10/15min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Enrollment pending approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '400':
          description: |
            Validation failure. `error` is one of:
            `invalid_username`, `invalid_device_id`, `invalid_public_key`,
            `invalid_aes_key`, `stale_payload`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            `error` is one of:
            `invalid_signature` (signature does not verify),
            `replay` (this exact signed payload was already used).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'No such account (`error: unknown_account`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `error` is one of:
            `device_exists` (device id already registered on the account),
            `device_limit` (account already has its maximum number of devices).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/devices/enroll-status/{enrollId}:
    get:
      tags: [devices]
      operationId: deviceEnrollStatus
      summary: Poll the state of a pending enrollment
      description: |
        Called by the enrolling device while it waits for approval. Unauthenticated by
        necessity (the device has no JWT yet); the enrollId is an unguessable
        192-bit capability issued by `POST /api/devices/enroll`.
      parameters:
        - name: enrollId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16,64}$'
      responses:
        '200':
          description: Enrollment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollStatusResponse'
        '400':
          description: 'Malformed enrollId (`error: invalid_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: 'Enrollment expired or unknown (`error: expired`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/devices/pending:
    post:
      tags: [devices]
      operationId: devicePending
      summary: Inspect a pending enrollment before approving it
      description: |
        Returns the device id and request time for a pairing code, so the approving
        user can see WHAT they are about to approve (defense against social-engineered
        approvals). Does not consume the code.

        Rate limited per account (dedicated bucket, same limits as approve).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Pending enrollment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingResponse'
        '400':
          description: 'Code is not 6 digits (`error: invalid_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, malformed or expired token (`error: unauthorized`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'No pending enrollment with that code for this account (`error: unknown_code`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/devices/approve:
    post:
      tags: [devices]
      operationId: deviceApprove
      summary: Approve a pending enrollment from a registered device
      description: |
        A device already registered on the account enters the 6-digit code shown on the
        new device. Codes are scoped per account and single-use. The new device is
        added atomically, subject to the account's device limit; the enrolling device
        sees the approval on its next status poll.

        Rate limited per account (default 20/15min).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Device approved and added to the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveResponse'
        '400':
          description: 'Code is not 6 digits (`error: invalid_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'Missing, malformed or expired token (`error: unauthorized`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            No pending enrollment with that code for this account
            (`error: unknown_code`). Also returned when the code was already used or
            expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `error` is one of:
            `device_exists` (device was added in the meantime),
            `device_limit` (account reached its device maximum).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/devices:
    get:
      tags: [devices]
      operationId: deviceList
      summary: List the authenticated user's devices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device list (public keys and AES keys are never included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          description: 'Missing, malformed or expired token (`error: unauthorized`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'Account no longer exists (`error: unknown_account`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/diagnostics:
    post:
      summary: Submit a client diagnostics report
      description: >
        Stores a plain-text snapshot of the app's local state (origin,
        IndexedDB contents, storage quota) for troubleshooting devices that
        cannot run a web inspector. Works signed or anonymous; rate-limited
        per IP, size-capped, and reports expire automatically after 30 days.
      tags: [Diagnostics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report]
              properties:
                report:
                  type: string
                  maxLength: 16384
                  description: Plain-text diagnostics snapshot.
      responses:
        '202':
          description: 'Report accepted (`{ ok: true }`); stored with server-side ip/ua/account metadata.'
        '400':
          description: '`error: invalid_report` — report missing or empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Per-IP rate limit reached.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT issued by /api/auth/verify.

  responses:
    RateLimited:
      description: 'Too many requests (`error: rate_limited`).'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    StageBudget:
      type: object
      description: One fixed-window vouching budget (verify/trust × daily/weekly).
      properties:
        limit:
          type: integer
          description: 'Actions allowed in the window (admin layering: user > app > default).'
        used:
          type: integer
          description: Spend so far, clamped to the limit (blocked attempts still count).
        resetInSec:
          type: integer
          description: Seconds until the window resets (0 when untouched).

    Username:
      type: string
      description: 5-64 characters of `[a-zA-Z0-9_-]`; normalised to lowercase at signup, case-insensitively unique.
      pattern: '^[a-zA-Z0-9_-]{4,64}$'
      example: alice

    DeviceId:
      type: string
      description: |
        Client-generated device identifier, 8–64 characters of `[a-zA-Z0-9_-]`
        (clients use `crypto.randomUUID()`).
      pattern: '^[a-zA-Z0-9_-]{8,64}$'
      example: 01234567-89ab-cdef-0123-456789abcdef

    PublicKey:
      type: string
      description: Raw 32-byte Ed25519 public key, base64url-encoded.
      example: k7Sb3QKx9d2mVn4rT8uYw1zAe5fGh0jLpQsXcBvN

    AesKey:
      type: string
      description: |
        Raw AES-GCM transport key (16, 24 or 32 bytes; clients use 32),
        base64url-encoded. Encrypts client <-> server traffic only; message content is
        additionally end-to-end encrypted with per-conversation keys.
      example: F9r2KjLm8nPqRsT1uVwXyZa3bCdEfGhIjKlMnOpQrS

    Signature:
      type: string
      description: 64-byte Ed25519 signature, base64url-encoded.
      example: zYxWvUtSrQpOnMlKjIhGfEdCbAzYxWvUtSrQpOnMlKjIhGfEdCbAzYxWvUtSrQpOnMlKjIhGfEdCbA

    Nonce:
      type: string
      description: Random 32 bytes, base64url-encoded. Single-use, TTL-limited.
      example: nOq3rT6uYw9zAc2eFg5hJk8mNpQsVx

    SignupRequest:
      type: object
      required: [u, p, x, a, d, t, s]
      properties:
        u:
          $ref: '#/components/schemas/Username'
        p:
          $ref: '#/components/schemas/PublicKey'
        a:
          $ref: '#/components/schemas/AesKey'
        d:
          $ref: '#/components/schemas/DeviceId'
        t:
          type: integer
          description: |
            Client timestamp (epoch seconds) at signing time. Must be within
            `SIGNED_PAYLOAD_MAX_AGE_SEC` (default 300s) of server time.
        s:
          allOf:
            - $ref: '#/components/schemas/Signature'
          description: |
            Ed25519 signature over the UTF-8 bytes of the canonical JSON of
            `{ a, d, p, t, u, x }` (keys sorted, no whitespace). Single-use:
            the server rejects any signature it has seen before.
        x:
          allOf:
            - $ref: '#/components/schemas/PublicKey'
          description: |
            Raw 32-byte X25519 key-agreement public key, base64url-encoded
            (milestone 3: pairwise conversation keys). Covered by `s`.
        r:
          allOf:
            - $ref: '#/components/schemas/Username'
          description: |
            OPTIONAL, UNSIGNED referral: the username whose share link
            (`/?chat=<r>`) this signup followed. Recorded as the new account's
            parent (`users.ref`) and as a `created` edge in the admin graph.
            Deliberately outside the signature — widening it would break every
            shipped client for a field that grants nothing (no reward, no
            score, no capability). Junk, self-referrals and unknown names are
            ignored; see docs/SHARES.md.

    SignupResponse:
      type: object
      required: [u]
      properties:
        u:
          $ref: '#/components/schemas/Username'
        ref:
          allOf:
            - $ref: '#/components/schemas/Username'
          description: Echoed when `r` was accepted (the account's parent).

    ChallengeRequest:
      type: object
      required: [u, d]
      properties:
        u:
          $ref: '#/components/schemas/Username'
        d:
          $ref: '#/components/schemas/DeviceId'

    ChallengeResponse:
      type: object
      required: [n]
      properties:
        n:
          $ref: '#/components/schemas/Nonce'

    VerifyRequest:
      type: object
      required: [u, d, n, s]
      properties:
        u:
          $ref: '#/components/schemas/Username'
        d:
          $ref: '#/components/schemas/DeviceId'
        n:
          $ref: '#/components/schemas/Nonce'
        s:
          allOf:
            - $ref: '#/components/schemas/Signature'
          description: Ed25519 signature over the UTF-8 bytes of the nonce string `n`.

    VerifyResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: |
            HS256 JWT. Payload: `{ sub: <lowercase username>, u: <display username>,
            d: <device id>, iat, exp }`. Send as `Authorization: Bearer <token>`.

    MeResponse:
      type: object
      required: [u, d, createdAt]
      properties:
        u:
          $ref: '#/components/schemas/Username'
        d:
          $ref: '#/components/schemas/DeviceId'
        createdAt:
          type: string
          format: date-time
          description: Account creation time.

    PairingCode:
      type: string
      description: 6-digit numeric pairing code shown on the enrolling device.
      pattern: '^\d{6}$'
      example: '482913'

    EnrollResponse:
      type: object
      required: [code, enrollId, expiresInSec]
      properties:
        code:
          $ref: '#/components/schemas/PairingCode'
        enrollId:
          type: string
          description: |
            Unguessable capability identifying this enrollment; used to poll
            `GET /api/devices/enroll-status/{enrollId}`.
        expiresInSec:
          type: integer
          description: Seconds until the pairing code expires.

    EnrollStatusResponse:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
          description: |
            True once an existing device approved the enrollment. The enrolling
            device can then log in via the challenge-response flow.

    ApproveRequest:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/PairingCode'

    ApproveResponse:
      type: object
      required: [approved]
      properties:
        approved:
          allOf:
            - $ref: '#/components/schemas/DeviceId'
          description: The device id that was added to the account.

    PendingResponse:
      type: object
      required: [d, requestedAt]
      properties:
        d:
          $ref: '#/components/schemas/DeviceId'
        requestedAt:
          type: string
          format: date-time
          description: When the enrollment was requested.

    DeviceInfo:
      type: object
      required: [id, main, current, createdAt, lastSeenAt]
      properties:
        id:
          $ref: '#/components/schemas/DeviceId'
        main:
          type: boolean
          description: True for the first (main) device on the account.
        current:
          type: boolean
          description: True when this is the device making the request.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    DeviceListResponse:
      type: object
      required: [maxDevices, devices]
      properties:
        maxDevices:
          type: integer
          description: Maximum devices allowed on this account.
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInfo'

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code (documented per endpoint).
          example: invalid_username
        message:
          type: string
          description: Human-readable description.
          example: Username must be 5+ chars of [a-zA-Z0-9_-]
