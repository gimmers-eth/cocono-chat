<section id="view-auth" hidden>
  <p id="auth-hint">Create an account. Your keys are generated on this device and never leave it.</p>
  <div id="signup-row">
    <input id="username" type="text" autocomplete="username" spellcheck="false"
           placeholder="username (5+ chars: a-z, 0-9, _ -)" maxlength="64" />
    <button id="btn-signup">Create account</button>
  </div>
  <p id="add-device-section" class="dim">
    Already have an account?
    <button id="btn-show-add" class="linkish">Add this device to it</button>
  </p>
  <div id="add-device-row" hidden>
    <input id="add-username" type="text" autocomplete="username" spellcheck="false"
           placeholder="your existing username" maxlength="64" />
    <button id="btn-enroll">Add device</button>
    <button id="btn-enroll-cancel" class="danger">Back</button>
  </div>
  <div id="enroll-waiting" hidden>
    <p>Enter this code on one of your existing devices:</p>
    <p id="enroll-code" class="code"></p>
    <p id="enroll-status-line" class="dim">Waiting for approval…</p>
  </div>
  <button id="btn-login" hidden>Log in</button>
  <p id="auth-status" class="status" role="status"></p>
</section>
