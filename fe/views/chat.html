<section id="view-chat" hidden>
  <div class="chat-header">
    <button id="btn-chat-back" class="linkish">← Back</button>
    <strong id="chat-peer"></strong>
    <span id="ws-state" class="dim"></span>
  </div>
  <ul id="chat-messages"></ul>
  <p id="chat-status" class="status"></p>
  <div class="approve-row">
    <input id="chat-input" type="text" autocomplete="off" placeholder="Type a message…" maxlength="4000" />
    <button id="btn-send">Send</button>
  </div>
</section>
